# lefthook.yml — Tesseract pre-commit/pre-push hooks
#
# Pre-commit formatting and frontend linting inspect staged files. Go lint and
# vet run repository analysis when a staged Go file makes them relevant.
# Pre-push always runs the repository test gate: filtering it by pushed file
# types would let documentation-only pushes bypass qualification entirely.

pre-commit:
  parallel: true
  commands:

    # ── Go parallel group ─────────────────────────────────────────────
    # These three run simultaneously on staged .go files.

    go-format:
      # Fail if any staged Go file is not gofmt clean (and goimports clean when
      # goimports is installed). Tool failures are errors, not empty success.
      glob: "*.go"
      run: |
        unformatted=$(gofmt -l {staged_files} 2>&1)
        status=$?
        if [ "$status" -ne 0 ]; then
          echo "gofmt failed (exit $status):"
          printf '%s\n' "$unformatted"
          exit "$status"
        fi
        if command -v goimports >/dev/null 2>&1; then
          imports=$(goimports -l {staged_files} 2>&1)
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "goimports failed (exit $status):"
            printf '%s\n' "$imports"
            exit "$status"
          fi
          unformatted=$(printf '%s\n%s' "$unformatted" "$imports")
        fi
        if [ -n "$unformatted" ]; then
          echo "Unformatted files:"
          printf '%s\n' "$unformatted" | sed '/^$/d' | sort -u
          exit 1
        fi

    go-lint:
      # Only lints new/modified code so existing warnings don't block commits.
      glob: "*.go"
      run: golangci-lint run --new

    go-vet:
      glob: "*.go"
      run: go vet ./...

    # ── Frontend parallel group ───────────────────────────────────────

    frontend-lint:
      glob: "*.{ts,tsx,js,jsx}"
      root: "frontend/"
      # Use the lockfile-installed binary. Bare `npx biome` may silently fetch
      # the unrelated biome@0.3 package when node_modules is absent.
      run: ./node_modules/.bin/biome check --no-errors-on-unmatched {staged_files}

pre-push:
  commands:

    go-test:
      # Full test suite gate before code reaches the remote.
      run: make test
