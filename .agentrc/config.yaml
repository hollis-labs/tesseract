# Project agentrc config — vanta-conduit
agentrc_version: 2.2.0

agents:
  conduit-backend:
    name: Vanta Conduit Backend Engineer
    description: Go service development for Vanta Conduit context memory, RAG, and document storage
    roles: [backend, go]
    skills: [go-build, go-lint, go-test]
    context: agents/backend.md

  conduit-frontend:
    name: Vanta Conduit Frontend Developer
    description: React frontend development for the Conduit UI
    roles: [frontend, react]
    context: agents/frontend.md

  conduit-reviewer:
    name: Vanta Conduit Code Reviewer
    description: Code review for Conduit PRs
    roles: [code-review, go]
    skills: [go-lint, go-test]
